name = "class-26"
main = "src/index.js"
compatibility_date = "2025-01-01"

[[kv_namespaces]]
binding = "CLASS_KV"
id = "3b0183b8c07e4dbea43c84c455d0bc5e"
preview_urls = false
workers_dev = true

[[rules]]
type = "Data"
globs = ["**/*.woff2", "**/*.jpg", "**/*.png"]
fallthrough = true

[vars]
VAPID_PUBLIC = "BCeNtwIQwW1Bfsd1Z_ZuAnt25Scm0R_TfwrNFSs4PPLno1Fd1TLQaKIEw0R0tZt9xC2xjrV8Crdr2CUwMvBbJdA"   # 푸시 알림용 공개키 (비공개키는 secret VAPID_PRIVATE)

[triggers]
crons = ["*/30 * * * *"]   # 30분마다: 각자 정한 시각(기본 아침 07:30, 저녁 20:00)에 알림 발송
