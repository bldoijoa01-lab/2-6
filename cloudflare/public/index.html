<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2-6 알림장</title>
<meta name="description" content="2학년 6반 알림장 · 일정 D-day · 기말 시간표 · 이동교실 계산기">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="ribbon" aria-hidden="true"><span>2학년 6반 공식 알림장 · 읽었으면 엄지 ㄱㄱ</span></header>

<main class="wrap">
  <div class="hero">
    <div class="hero-sub">2-6이 알려주는</div>
    <h1 class="hero-title"><span class="c1">알</span><span class="c2">림</span><span class="c3">장</span><span class="c4">!!</span></h1>
    <div class="hero-date" id="todayLabel"></div>
  </div>

  <nav class="tabs" role="tablist" aria-label="메뉴">
    <button class="tab" role="tab" id="tab-today" aria-controls="panel-today" aria-selected="true" data-tab="today">오늘</button>
    <button class="tab" role="tab" id="tab-table" aria-controls="panel-table" aria-selected="false" data-tab="table">기말 시간표</button>
    <button class="tab" role="tab" id="tab-move" aria-controls="panel-move" aria-selected="false" data-tab="move">이동교실</button>
    <button class="tab" role="tab" id="tab-caution" aria-controls="panel-caution" aria-selected="false" data-tab="caution">유의사항</button>
  </nav>

  <section id="panel-today" class="panel" role="tabpanel" aria-labelledby="tab-today"></section>
  <section id="panel-table" class="panel" role="tabpanel" aria-labelledby="tab-table" hidden></section>
  <section id="panel-move" class="panel" role="tabpanel" aria-labelledby="tab-move" hidden></section>
  <section id="panel-caution" class="panel" role="tabpanel" aria-labelledby="tab-caution" hidden></section>

  <footer class="foot">
    <div class="foot-big">읽었으면 엄지 ㄱㄱ</div>
    <div class="foot-small" id="updated"></div>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
